name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Prepare Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not found"
            exit 1
          fi
          echo "APK successfully built: $(ls -lh $APK_PATH)"
          mkdir -p apk-distribution
          cp "$APK_PATH" apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "SHA256: $(cat app-debug.apk.sha256)"

      - name: Create GitHub Release & Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="AlignPulse Android Release (Build ${{ github.run_number }})"
          
          # Delete existing release with same tag if rerun
          gh release delete "$TAG_NAME" --yes || true
          
          # Create latest release and upload asset
          gh release create "$TAG_NAME" apk-distribution/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "Direct installable Android APK for AlignPulse." \
            --latest

      - name: Summary
        run: |
          echo "### 🚀 Android APK Released Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL**: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: \`apk-distribution/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
