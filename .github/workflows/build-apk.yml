name: Build and Publish Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not found at $APK_PATH"
            exit 1
          fi
          echo "APK successfully built: $(ls -lh $APK_PATH)"
          mkdir -p apk-distribution
          cp "$APK_PATH" apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "SHA256: $(cat app-debug.apk.sha256)"

      - name: Create GitHub Release & Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="AlignPulse Android Release (Build ${{ github.run_number }})"
          
          # Delete existing release with same tag if rerun
          gh release delete "$TAG_NAME" --yes || true
          
          # Delete existing latest release asset if present to ensure clean update
          gh release create "$TAG_NAME" apk-distribution/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "Direct installable Android APK for AlignPulse. Built with GitHub Actions." \
            --latest

      - name: Summary
        run: |
          echo "### 🚀 Android APK Released Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL**: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: \`apk-distribution/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
